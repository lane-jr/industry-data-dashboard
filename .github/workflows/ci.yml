name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion scripts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python src/ingest/fred.py
          python src/ingest/fdic.py

      - name: Run transform pipeline
        run: |
          python src/transform/transform_fred.py
          python src/transform/transform_fdic.py
          python src/transform/merge.py

      - name: Load database
        run: |
          python src/transform/load.py

      - name: Run tests
        run: |
          pytest tests/ -v